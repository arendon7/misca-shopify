<text x="54" y="52" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="8" fill="#f2eee6">MISCA / ESTUDIO VISUAL</text>
<rect x="118" y="190" width="930" height="760" rx="4" fill="#d1cbc0"/>
<path d="M90 1010 C260 870 330 760 415 610 C485 488 560 438 660 345" fill="none" stroke="#1c1f1b" stroke-width="18"/>
<path d="M110 1050 C315 930 375 795 505 700 C595 635 705 600 840 438" fill="none" stroke="#262a24" stroke-width="10"/>
<path d="M250 990 C370 820 430 760 520 665 M420 780 C360 680 332 595 300 520 M575 625 C705 550 785 470 895 348" fill="none" stroke="#2a2d27" stroke-width="7"/>
