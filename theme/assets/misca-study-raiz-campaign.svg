<path d="M838 350 C900 286 976 278 1052 300 C980 342 931 389 900 455 C871 427 850 392 838 350Z" fill="#879575"/>
<rect x="1110" y="190" width="364" height="760" fill="#f4efe6"/>
<text x="1150" y="290" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="5" fill="#6c685f">ALMA RÍOS</text>
<text x="1150" y="392" font-family="Georgia,serif" font-size="84" fill="#171814">Raíz</text>
<text x="1150" y="470" font-family="Georgia,serif" font-size="84" fill="#171814">de concreto</text>
<line x1="1150" x2="1418" y1="535" y2="535" stroke="#aaa398"/>
<text x="1150" y="600" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#4c4b45">Entre grietas / 01</text>
<text x="1150" y="670" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#777168">Estudio de dirección visual.</text>
<text x="1150" y="704" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#777168">No fotografía de producto.</text>
<text x="118" y="1088" font-family="Georgia,serif" font-size="54" fill="#171814">Incluso el concreto deja espacio para crecer.</text>
<text x="118" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="3" fill="#6d685f">MARFIL · NEGRO · MUSGO · ESCALA / VACÍO / BORDE</text>
</svg>