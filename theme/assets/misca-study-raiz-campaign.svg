<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Raíz de concreto — estudio visual de campaña</title>
<desc id="desc">Composición conceptual en tonos marfil, concreto, negro y verde musgo. No representa fotografía final de producto.</desc>
