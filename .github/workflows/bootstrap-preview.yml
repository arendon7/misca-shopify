name: Bootstrap Shopify preview theme

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-preview-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-preview:
    runs-on: ubuntu-latest
    environment: shopify-preview
    env:
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_CLI_NO_ANALYTICS: '1'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Shopify CLI version
        run: shopify version

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SHOPIFY_FLAG_STORE:-}" || { echo 'Missing SHOPIFY_FLAG_STORE'; exit 1; }
          test -n "${SHOPIFY_CLI_THEME_TOKEN:-}" || { echo 'Missing SHOPIFY_CLI_THEME_TOKEN'; exit 1; }
          case "$SHOPIFY_FLAG_STORE" in
            *.myshopify.com|https://*.myshopify.com) ;;
            *) echo 'SHOPIFY_FLAG_STORE must be a .myshopify.com store domain'; exit 1 ;;
          esac

      - name: Refuse duplicate MISCA preview bootstrap
        shell: bash
        run: |
          set -euo pipefail
          shopify theme list \
            --path theme \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --role unpublished \
            --name 'MISCA Preview' \
            --json > existing-preview.json

          COUNT="$(jq 'length' existing-preview.json)"
          if [ "$COUNT" -gt 0 ]; then
            echo 'An unpublished theme matching MISCA Preview already exists.' >&2
            jq '.' existing-preview.json >&2
            echo 'Do not create another. Configure SHOPIFY_PREVIEW_THEME_ID with the existing theme ID and use Deploy Shopify preview theme.' >&2
            exit 1
          fi

      - name: Create new unpublished preview theme
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          shopify theme push \
            --path theme \
            --unpublished \
            --strict \
            --json \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            > bootstrap-result.json

          THEME_ID="$(jq -r '.theme.id // empty' bootstrap-result.json)"
          THEME_ROLE="$(jq -r '.theme.role // empty' bootstrap-result.json)"

          [[ "$THEME_ID" =~ ^[0-9]+$ ]] || { echo 'Bootstrap did not return a numeric theme ID'; cat bootstrap-result.json; exit 1; }
          [ "$THEME_ROLE" = 'unpublished' ] || { echo "Bootstrap returned unexpected theme role: $THEME_ROLE"; cat bootstrap-result.json; exit 1; }

          echo "THEME_ID=$THEME_ID" >> "$GITHUB_ENV"

      - name: Rename preview theme
        shell: bash
        run: |
          set -euo pipefail
          shopify theme rename \
            --path theme \
            --theme "$THEME_ID" \
            --name 'MISCA Preview' \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN"

      - name: Verify created theme is still unpublished
        shell: bash
        run: |
          set -euo pipefail
          shopify theme list \
            --path theme \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --id "$THEME_ID" \
            --role unpublished \
            --json > bootstrap-verify.json

          jq -e --arg id "$THEME_ID" '
            length == 1 and
            ((.[0].id | tostring) == $id) and
            (.[0].role == "unpublished")
          ' bootstrap-verify.json > /dev/null

      - name: Write bootstrap summary
        shell: bash
        run: |
          set -euo pipefail
          THEME_NAME="$(jq -r '.theme.name // "MISCA Preview"' bootstrap-result.json)"
          PREVIEW_URL="$(jq -r '.theme.preview_url // empty' bootstrap-result.json)"
          EDITOR_URL="$(jq -r '.theme.editor_url // empty' bootstrap-result.json)"

          {
            echo '## Shopify preview bootstrap'
            echo
            echo "- Theme name: \`$THEME_NAME\`"
            echo "- Theme ID: \`$THEME_ID\`"
            echo '- Theme role: `unpublished`'
            echo "- Source commit: \`$GITHUB_SHA\`"
            if [ -n "$PREVIEW_URL" ]; then echo "- Preview: $PREVIEW_URL"; fi
            if [ -n "$EDITOR_URL" ]; then echo "- Theme editor: $EDITOR_URL"; fi
            echo
            echo '### Required follow-up'
            echo "Set repository/environment variable \`SHOPIFY_PREVIEW_THEME_ID\` to \`$THEME_ID\`."
            echo 'After that, use **Deploy Shopify preview theme** for all subsequent updates.'
          } >> "$GITHUB_STEP_SUMMARY"
