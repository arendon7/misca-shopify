name: Deploy MISCA web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate storefront preview
        shell: bash
        run: |
          set -euo pipefail
          test -f preview/site/index.html
          test -f preview/site/styles.css
          test -f preview/site/v5.css
          test -f preview/site/v6.css
          test -f preview/site/v7.css
          test -f preview/site/v8.css
          test -f preview/site/v9.css
          test -f preview/site/v10.css
          test -f preview/site/v11.css
          test -f preview/site/v12.css
          test -f preview/site/v13.css
          test -f preview/site/v14.css
          test -f preview/site/v15.css
          test -f preview/site/app.js
          test -f preview/site/fixes.js
          test -f preview/site/v5.js
          test -f preview/site/v6.js
          test -f preview/site/v7.js
          test -f preview/site/v8.js
          test -f preview/site/v9.js
          test -f preview/site/v10.js
          test -f preview/site/v11.js
          test -f preview/site/v12.js
          test -f preview/site/v13.js
          test -f preview/site/v14.js
          test -f preview/site/v15.js
          for f in cover front back detail context art-crop spec-card; do test -f "preview/site/assets/products/raiz/$f.svg"; done
          for f in cover front back detail context art-crop spec-card; do test -f "preview/site/assets/products/ola/$f.svg"; done
          test -f preview/site/assets/universes/alma-rios-entre-grietas.svg
          test -f preview/site/assets/universes/tomas-muro-muros-que-hablan.svg
          test -f preview/site/assets/universes/nina-cobalto-frecuencia.svg
          test -f preview/site/assets/universes/simon-bestiario-animales-del-ruido.svg
          test -f preview/site/assets/universes/vera-montana-ciudad-vertical.svg
          test -f preview/site/assets/universes/hokusai-la-fuerza-del-agua.svg
          test -f preview/site/assets/universes/william-morris-naturaleza-repetida.svg
          test -f preview/site/assets/universes/alphonse-mucha-las-estaciones.svg
          test -f preview/site/assets/universes/van-gogh-el-paisaje-se-mueve.svg
          test -f preview/site/assets/universes/monet-jardines-de-luz.svg
          node --check preview/site/app.js
          node --check preview/site/fixes.js
          node --check preview/site/v5.js
          node --check preview/site/v6.js
          node --check preview/site/v7.js
          node --check preview/site/v8.js
          node --check preview/site/v9.js
          node --check preview/site/v10.js
          node --check preview/site/v11.js
          node --check preview/site/v12.js
          node --check preview/site/v13.js
          node --check preview/site/v14.js
          node --check preview/site/v15.js
          grep -q 'id="app"' preview/site/index.html
          grep -q 'GitHub Pages' preview/site/index.html
          grep -q 'v15.css' preview/site/index.html
          grep -q 'v15.js' preview/site/index.html
          grep -q 'WEB-COMMERCE V15' preview/site/index.html
          ! grep -q 'v2.css' preview/site/index.html
          ! grep -q 'v3.css' preview/site/index.html
          ! grep -q 'v4.css' preview/site/index.html
          ! grep -q 'v2.js' preview/site/index.html
          ! grep -q 'v3.js' preview/site/index.html
          ! grep -q 'v4.js' preview/site/index.html
          grep -q 'v6-mobile-buybar' preview/site/v6.js
          grep -q 'activeHandles' preview/site/v7.js
          grep -q 'garmentSVG' preview/site/v8.js
          grep -q 'Dirección A' preview/site/v9.js
          grep -q 'data-v10-workshop-spec' preview/site/v10.js
          grep -q 'data-asset-slot' preview/site/v11.js
          grep -q '10 universos / 2 en lanzamiento' preview/site/v12.js
          grep -q 'static-master-v1' preview/site/v13.js
          grep -q 'Campaña conceptual' preview/site/v14.js
          grep -q 'Dos prendas. Ninguna distracción.' preview/site/v15.js
          grep -q 'Decisiones que no necesita ver el comprador.' preview/site/v15.js
          grep -q 'Talla requerida' preview/site/v15.js
          grep -q 'v15-development-open' preview/site/v15.css
          grep -q 'raiz/cover.svg' preview/site/v14.js
          grep -q 'ola/cover.svg' preview/site/v14.js
          grep -q 'RC-SCR-01 / RC-DTF-01' preview/site/assets/products/raiz/spec-card.svg
          grep -q 'OLA-DTG-01 / OLA-DTF-01' preview/site/assets/products/ola/spec-card.svg
          grep -q 'The Met · JP1847' preview/site/assets/products/ola/spec-card.svg
          grep -q 'T265 hipótesis master' preview/site/assets/products/raiz/spec-card.svg
          grep -q 'T265 hipótesis master' preview/site/assets/products/ola/spec-card.svg

      - name: Build storefront preview + status artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/status

          cp -R preview/site/. _site/
          cp -R status/site/. _site/status/
          cp status/project-status.json _site/status/project-status.json

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          sha = os.environ.get('GITHUB_SHA', '')
          payload = {
              'sha': sha,
              'shortSha': sha[:8],
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
              'runNumber': os.environ.get('GITHUB_RUN_NUMBER', ''),
              'workflow': os.environ.get('GITHUB_WORKFLOW', ''),
              'refName': os.environ.get('GITHUB_REF_NAME', ''),
              'repository': os.environ.get('GITHUB_REPOSITORY', ''),
              'previewVersion': 'WEB-COMMERCE V15',
              'builtAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          with open('_site/status/runtime.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          with open('_site/preview-runtime.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
