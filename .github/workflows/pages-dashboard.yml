name: Deploy MISCA web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build storefront preview + status artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/status

          # The customer-facing review surface lives at the Pages root.
          cp -R preview/site/. _site/

          # The project dashboard remains available as a secondary route.
          cp -R status/site/. _site/status/
          cp status/project-status.json _site/status/project-status.json

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          sha = os.environ.get('GITHUB_SHA', '')
          payload = {
              'sha': sha,
              'shortSha': sha[:8],
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
              'runNumber': os.environ.get('GITHUB_RUN_NUMBER', ''),
              'workflow': os.environ.get('GITHUB_WORKFLOW', ''),
              'refName': os.environ.get('GITHUB_REF_NAME', ''),
              'repository': os.environ.get('GITHUB_REPOSITORY', ''),
              'builtAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          with open('_site/status/runtime.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          with open('_site/preview-runtime.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
