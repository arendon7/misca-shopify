name: Deploy MISCA web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate V31 launch candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f preview/site/index.html
          test -f preview/site/app.js
          test -f preview/site/fixes.js
          test -f docs/V30_RUNTIME_CONSOLIDATION.md
          test -f docs/V31_LAUNCH_AUDIT.md

          node --check preview/site/app.js
          node --check preview/site/fixes.js
          for v in 6 7 15 17 18 19 23 25; do
            test -f "preview/site/v${v}.js"
            node --check "preview/site/v${v}.js"
          done

          for v in 5 8 9 10 11 12 13 14; do
            test -f "preview/site/v${v}.js"
            test -f "preview/site/v${v}.css"
            ! grep -q "v${v}.js" preview/site/index.html
            ! grep -q "v${v}.css" preview/site/index.html
          done
          ! grep -q '<script src="./v16.js"></script>' preview/site/index.html

          grep -q 'PUBLIC-LAUNCH-AUDIT V31' preview/site/index.html
          grep -q 'noindex,nofollow' preview/site/index.html
          grep -q 'v31-launch-audit' preview/site/index.html
          grep -q 'aria-controls="mobileMenu"' preview/site/index.html
          grep -q 'aria-controls="cartDrawer"' preview/site/index.html
          grep -q 'aria-controls="searchOverlay"' preview/site/index.html
          grep -q 'aria-live="polite"' preview/site/index.html
          grep -q 'v31-overlay-open' preview/site/index.html
          grep -q 'main.inert=any' preview/site/index.html
          grep -q 'function syncMeta' preview/site/index.html
          grep -q 'rel="preload" as="image"' preview/site/index.html

          python - <<'PY'
          from pathlib import Path
          html = Path('preview/site/index.html').read_text(encoding='utf-8')
          assert html.count('<link rel="stylesheet"') == 10
          assert html.count('<script src=') == 10
          assert html.count('id="v31-launch-audit"') == 1
          assert html.index('v25.js') < html.index('fixes.js') < html.index('v31-launch-audit')
          PY

          grep -q 'v6-mobile-buybar' preview/site/v6.js
          grep -q 'activeHandles' preview/site/v7.js
          grep -q 'galleryHtml' preview/site/v15.js
          grep -q 'guardProductRoute' preview/site/v17.js
          grep -q 'v27.css' preview/site/v19.js
          grep -q 'v23-home-hero' preview/site/v23.js
          grep -q 'raiz-campaign.webp' preview/site/v25.js
          grep -q 'v28-shop-switcher' preview/site/fixes.js
          grep -q 'v29-home-shopbar' preview/site/fixes.js

          for f in cover front back detail context art-crop spec-card; do
            test -f "preview/site/assets/products/raiz/$f.svg"
            test -f "preview/site/assets/products/ola/$f.svg"
          done
          test -s preview/site/assets/generated/v25/raiz-campaign.webp
          test -s preview/site/assets/generated/v25/ola-campaign.webp
          test -s preview/site/assets/generated/v26/ola-pdp-context.webp

          grep -q 'canonical_url' theme/layout/theme.liquid
          grep -q 'page_description' theme/layout/theme.liquid
          grep -q "request.page_type == 'search' or request.page_type == '404'" theme/layout/theme.liquid

      - name: Build storefront preview + status artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/status
          cp -R preview/site/. _site/
          cp -R status/site/. _site/status/
          cp status/project-status.json _site/status/project-status.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          sha = os.environ.get('GITHUB_SHA', '')
          payload = {
              'sha': sha,
              'shortSha': sha[:8],
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
              'runNumber': os.environ.get('GITHUB_RUN_NUMBER', ''),
              'workflow': os.environ.get('GITHUB_WORKFLOW', ''),
              'refName': os.environ.get('GITHUB_REF_NAME', ''),
              'repository': os.environ.get('GITHUB_REPOSITORY', ''),
              'previewVersion': 'PUBLIC-LAUNCH-AUDIT V31',
              'builtAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          for target in ('_site/status/runtime.json','_site/preview-runtime.json'):
              with open(target,'w',encoding='utf-8') as fh:
                  json.dump(payload,fh,ensure_ascii=False,indent=2)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
