name: Shopify theme check

on:
  pull_request:
    paths:
      - 'theme/**'
      - 'docs/SHOPIFY_COMMERCE_READINESS_V1.md'
      - 'docs/VISUAL_ASSET_INVENTORY_V2.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'theme/**'
      - 'docs/SHOPIFY_COMMERCE_READINESS_V1.md'
      - 'docs/VISUAL_ASSET_INVENTORY_V2.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Shopify CLI version
        run: shopify version

      - name: Theme Check
        run: shopify theme check --path theme --fail-level error --no-color

      - name: Commerce readiness guards
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/SHOPIFY_COMMERCE_READINESS_V1.md
          test -f theme/assets/commerce-readiness.css
          grep -q 'custom.commerce_status' theme/sections/main-product.liquid
          grep -q 'data-commerce-ready' theme/sections/main-product.liquid
          grep -q 'show_prelaunch_price' theme/sections/main-product.liquid
          grep -q 'if commerce_ready' theme/sections/main-product.liquid
          grep -q 'custom.commerce_status' theme/snippets/product-card.liquid
          grep -q 'enforce_commerce_readiness' theme/config/settings_schema.json
          grep -q 'theme_version":"0.3.0"' theme/config/settings_schema.json
          grep -q 'commerce-readiness.css' theme/layout/theme.liquid
          grep -q 'commerceReady' theme/assets/theme.js
          grep -q 'misca:commerce-blocked' theme/assets/theme.js
          grep -q "publish('commerce_blocked'" theme/assets/analytics.js
          grep -q 'data-cart-commerce-ready' theme/snippets/cart-drawer.liquid
          grep -q 'commerceLocked' theme/assets/cart-drawer.js
          grep -q 'cart_commerce_ready' theme/sections/main-cart.liquid

      - name: Visual asset library guards
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/VISUAL_ASSET_INVENTORY_V2.md
          test -f theme/assets/visual-fallbacks.css
          test -f theme/assets/visual-fallbacks.js
          node --check theme/assets/visual-fallbacks.js
          for product in raiz ola; do
            for frame in cover front back detail context art-crop spec-card; do
              test -f "theme/assets/misca-${product}-${frame}.svg"
            done
          done
          for universe in alma-rios tomas-muro nina-cobalto simon-bestiario vera-montana hokusai william-morris mucha van-gogh monet; do
            test -f "theme/assets/misca-universe-${universe}.svg"
          done
          grep -q 'misca-raiz-cover.svg' theme/sections/home-hero.liquid
          grep -q 'misca-ola-cover.svg' theme/sections/home-hero.liquid
          grep -q 'misca-concept-badge' theme/snippets/product-card.liquid
          grep -q 'misca-universe-fallback' theme/sections/artists-index.liquid
          grep -q 'misca-universe-fallback' theme/sections/main-artist.liquid
          grep -q 'misca-universe-fallback' theme/sections/main-list-collections.liquid
          grep -q 'collection-hero-media' theme/sections/main-collection.liquid
          grep -q 'visual-fallbacks.css' theme/layout/theme.liquid
          grep -q 'MiscaVisualAssets' theme/layout/theme.liquid
          grep -q 'visual-fallbacks.js' theme/layout/theme.liquid
          grep -q 'EXACT_CAMPAIGN_FILES_PENDING_IMPORT' docs/VISUAL_ASSET_INVENTORY_V2.md
