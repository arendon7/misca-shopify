name: Shopify theme check

on:
  pull_request:
    paths:
      - 'theme/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'theme/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Shopify CLI version
        run: shopify version

      - name: Theme Check
        run: shopify theme check --path theme --fail-level error --no-color
