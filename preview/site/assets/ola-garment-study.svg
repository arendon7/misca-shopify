<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Ola — estudio de adaptación a prenda</title>
<desc id="desc">Estudio conceptual de una camiseta navy con una adaptación lateral de la ola. No representa arte final de producción.</desc>
<rect width="1600" height="1200" fill="#d8d0bf"/>
<rect width="1600" height="80" fill="#122331"/>
<text x="54" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="8" fill="#eef0e5">MISCA / ARCHIVO ABIERTO / ESTUDIO</text>
<rect x="94" y="160" width="860" height="900" fill="#ece5d6"/>
<path d="M430 275 L305 352 L212 548 L318 600 L355 960 Q530 1025 705 960 L742 600 L848 548 L755 352 L630 275 Q530 335 430 275Z" fill="#142d40"/>
<path d="M268 742 C355 630 451 660 530 548 C610 435 734 464 817 390 C756 528 713 638 607 711 C515 776 394 790 268 742Z" fill="none" stroke="#e9e7d6" stroke-width="42" stroke-linecap="round"/>
<path d="M265 770 C379 683 481 714 580 620 C655 548 730 530 820 462" fill="none" stroke="#5d91a8" stroke-width="22" stroke-linecap="round"/>
<path d="M330 858 C446 806 539 833 632 764 C699 714 757 702 814 682" fill="none" stroke="#eef1e7" stroke-width="18" stroke-linecap="round"/>
<path d="M532 623 L562 674 L500 674 Z" fill="#d6c59d"/>
<line x1="1000" x2="1480" y1="220" y2="220" stroke="#9b9487"/>
<text x="1000" y="300" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="5" fill="#6d675f">HOKUSAI / LA FUERZA DEL AGUA</text>
<text x="1000" y="410" font-family="Georgia,serif" font-size="112" fill="#132838">Ola.</text>
<text x="1000" y="500" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#514f49">Hipótesis de ubicación:</text>
<text x="1000" y="545" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#514f49">costado → espalda</text>
<text x="1000" y="625" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#514f49">Fuji como detalle silencioso.</text>
<line x1="1000" x2="1480" y1="692" y2="692" stroke="#9b9487"/>
<text x="1000" y="760" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#746e65">ESTUDIO CONCEPTUAL</text>
<text x="1000" y="798" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#746e65">No es archivo final de impresión.</text>
<text x="1000" y="836" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#746e65">Producción partirá de fuente institucional.</text>
<text x="1000" y="940" font-family="Georgia,serif" font-size="43" fill="#132838">Todo cambia alrededor</text>
<text x="1000" y="992" font-family="Georgia,serif" font-size="43" fill="#132838">de lo que permanece.</text>
</svg>